name: Claude review

# Reviews code pull requests once when they open or become ready, against
# .github/REVIEW_GUIDE.md. Comment "@claude" on a pull request to ask again.
# Skips until the ANTHROPIC_API_KEY secret exists.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths: ["src/**", "plugins/**", "scripts/**", "tests/**"]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Automatic: non-draft pull requests from this repository.
    # On demand: an "@claude" comment from an owner, member or collaborator.
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - name: Check for the API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
      - name: Automatic review
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@1bc23c05956f182d538474fec6c62d9c830b47e9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against .github/REVIEW_GUIDE.md and AGENTS.md.
            Report only real problems: correctness, a broken "must hold" rule,
            missing tests at a boundary, or claims beyond the evidence. Skip style
            that ruff enforces. Use inline comments for specific lines and one short
            summary comment. If nothing needs changing, say so in one line.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      - name: Review on request
        if: steps.key.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@1bc23c05956f182d538474fec6c62d9c830b47e9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
